name: Analyze row 39 columns

on:
  push:
    paths:
      - '.github/workflows/analyze-row39-columns.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze columns
        run: python3 scripts/analyze_row39_columns.py
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add row39_column_diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add row 39 column diagnostic report"
          git push

# trigger entries 10 and 22 check
