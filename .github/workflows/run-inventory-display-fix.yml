name: Run inventory display repair

on:
  push:
    paths:
      - '.github/workflows/run-inventory-display-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inventory HTML
        run: python3 scripts/fix_inventory_display.py
      - name: Commit repaired inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cigar_inventory.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair inventory totals and formatting"
          git push
