name: Fix thumbnail entries 5 and 22

on:
  push:
    paths:
      - '.github/workflows/fix-thumbnail-entries.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Repair thumbnails
        run: python3 scripts/fix_thumbnail_entries.py
      - name: Commit repaired inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cigar_inventory.html thumbnail_fix_report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix thumbnails for inventory entries 5 and 22"
          git push

# trigger retry
