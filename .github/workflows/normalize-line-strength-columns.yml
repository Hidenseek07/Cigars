name: Normalize Line and Strength columns

on:
  push:
    paths:
      - '.github/workflows/normalize-line-strength-columns.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize columns
        run: python3 scripts/normalize_line_strength_columns.py
      - name: Commit normalized inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cigar_inventory.html line_strength_normalization_report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize Line and Strength columns across inventory"
          git push
