name: Analyze rows 10 and 22

on:
  push:
    paths:
      - '.github/workflows/analyze-rows-10-22.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze rows
        run: python3 scripts/analyze_rows_10_22.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rows_10_22_diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add rows 10 and 22 diagnostic"
          git push

# trigger
