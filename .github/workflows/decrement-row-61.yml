name: Decrement row 61 quantity

on:
  push:
    paths:
      - '.github/workflows/decrement-row-61.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrement quantity
        run: python3 scripts/decrement_row_61.py
      - name: Commit inventory update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cigar_inventory.html row61_quantity_verification.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reduce inventory quantity for row 61"
          git push

# trigger
